# Sentinel off-chain services. The Fabric network is managed separately by Fablo (fablo up).
# Start:  docker compose up -d --build      Stop:  docker compose down
services:
  db:
    image: postgres:16-alpine
    container_name: sentinel-db
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    volumes:
      - sentinel-db:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 256m

  audit-api:
    build: ./audit
    container_name: sentinel-audit-api
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@db:5432/audit
      AUDIT_SIGNING_SEED: "1111111111111111111111111111111111111111111111111111111111111111"  # demo only
      AUDIT_TOKEN: "demo-audit-token-change-me"  # demo only; writes without it get 401
      DEMO_INSIDER: "1"  # demo only: enables /demo/insider-rewrite (still needs the token)
    ports:
      - "127.0.0.1:8800:8800"  # this machine only, not your Wi-Fi network
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m

  api:
    build: ./api
    container_name: sentinel-api
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@db:5432/sentinel
      RP_ID: localhost
      RP_ORIGINS: http://localhost:5173
      AUDIT_URL: http://audit-api:8800
      AUDIT_STREAM: BankAMSP-auth
      DEMO_SIGNALS: "1"  # demo only: enables the operator signal injector (SIM swap, new device, call...)
      DEMO_OPERATOR_TOKEN: "demo-operator-token-change-me"  # demo only: the injector needs this token
      SHOW_ANALYST_VIEW: "1"  # demo only: score, points and FRI category in responses; off for real customers
      PAYEE_HMAC_KEY: "consortium-demo-key-v1"  # demo only; same key as scripts/scenario4.sh and the ledger
      AUDIT_TOKEN: "demo-audit-token-change-me"  # must match audit-api
      STUDY_ENABLED: "1"  # volunteer typing study at http://localhost:5173/#/study (invites need the operator token)
      STUDY_SESSION_GAP_HOURS: "4"  # minimum gap between a volunteer's sessions
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      audit-api:
        condition: service_started
    mem_limit: 256m

volumes:
  sentinel-db:
