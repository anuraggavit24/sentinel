# Sentinel off-chain services. The Fabric network is managed separately by Fablo (fablo up).
# Start:  docker compose up -d --build      Stop:  docker compose down
services:
  db:
    image: postgres:16-alpine
    container_name: sentinel-db
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    volumes:
      - sentinel-db:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 256m

  audit-api:
    build: ./audit
    container_name: sentinel-audit-api
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@db:5432/audit
      AUDIT_SIGNING_SEED: "1111111111111111111111111111111111111111111111111111111111111111"  # demo only
      AUDIT_TOKEN: "demo-audit-token-change-me"  # demo only; writes without it get 401
      DEMO_INSIDER: "1"  # demo only: enables /demo/insider-rewrite (still needs the token)
    ports:
      - "127.0.0.1:8800:8800"  # this machine only, not your Wi-Fi network
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m

  api:
    build: ./api
    container_name: sentinel-api
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@db:5432/sentinel
      RP_ID: localhost
      RP_ORIGINS: http://localhost:5173
      AUDIT_URL: http://audit-api:8800
      AUDIT_STREAM: BankAMSP-auth
      DEMO_SIGNALS: "1"  # demo only: enables the operator signal injector (SIM swap, new device, call...)
      DEMO_OPERATOR_TOKEN: "demo-operator-token-change-me"  # demo only: the injector needs this token
      SHOW_ANALYST_VIEW: "1"  # demo only: score, points and FRI category in responses; off for real customers
      PAYEE_HMAC_KEY: "consortium-demo-key-v1"  # demo only; same key as scripts/scenario4.sh and the ledger
      AUDIT_TOKEN: "demo-audit-token-change-me"  # must match audit-api
      STUDY_ENABLED: "1"  # volunteer typing study at http://localhost:5173/#/study (invites need the operator token)
      STUDY_SESSION_GAP_HOURS: "4"  # minimum gap between a volunteer's sessions
      LEDGER_URL: http://ledger-gateway:8100  # consortium ledger bridge (slice 2c); empty = not connected
      LEDGER_TOKEN: "demo-ledger-token-change-me"  # must match ledger-gateway
      LEDGER_TIMEOUT_MS: "1000"  # a payment waits at most this long for the ledger, then scores without it
      LEDGER_WRITE_TOKEN: "demo-ledger-write-token-change-me"  # Module 3a: analysts' reports go to the ledger
      LEDGER_MSP: BankAMSP  # this bank, as the ledger knows it
      DEMO_LOGIN: "1"  # demo only: http://localhost:5173/#/demo, three banks with one-click logins (NO passkey)
      # Module 4 copilot: set ANTHROPIC_API_KEY in your shell before `docker compose up` to let Claude write
      # answers; without it the copilot answers in extractive mode (quoted passages, nothing sent out).
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      COPILOT_MODEL: "${COPILOT_MODEL:-claude-sonnet-5-5}"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      audit-api:
        condition: service_started
      ledger-gateway:
        condition: service_started
    mem_limit: 256m

  # Bridge to the Fabric ledger. Default identity: BankA's User1 (the risk API and analysts' filings).
  # ORGS: it can also act as BankB, BankC and the Regulator, each with its own key and its own peer, for
  # the #/demo bank network (a demo shortcut: in production each bank runs its own gateway with its own key).
  # Reads need LEDGER_TOKEN, writes LEDGER_WRITE_TOKEN. Not published on the host. Starts even when Fablo
  # is down (payments then score without the ledger; filings wait).
  ledger-gateway:
    build: ./ledger-gateway
    container_name: sentinel-ledger-gateway
    environment:
      LEDGER_TOKEN: "demo-ledger-token-change-me"
      MSP_ID: BankAMSP
      PEER_ENDPOINT: host.docker.internal:7041  # BankA's peer as Fablo publishes it on this machine
      PEER_HOST_ALIAS: peer0.banka.example.com  # the name on the peer's TLS certificate
      MSP_DIR: /crypto/banka/users/User1@banka.example.com/msp
      TLS_CERT_PATH: /crypto/banka/peers/peer0.banka.example.com/tls/ca.crt
      CHANNEL: fraud-intel
      CHAINCODE: fraudintel
      LEDGER_TIMEOUT_MS: "700"  # below the API's 1000, so the sidecar answers "timeout" before the API gives up
      LEDGER_WRITE_TOKEN: "demo-ledger-write-token-change-me"  # separate secret; without it the write routes do not exist
      LEDGER_SUBMIT_TIMEOUT_MS: "15000"  # endorse (2 banks) + order + commit
      ORGS: BankA,BankB,BankC,Regulator  # peers on Fablo's ports 7041/7061/7081/7101; override with PEER_ENDPOINT_BANKB etc.
    volumes:
      - ./fablo-target/fabric-config/crypto-config/peerOrganizations/banka.example.com:/crypto/banka:ro
      - ./fablo-target/fabric-config/crypto-config/peerOrganizations/bankb.example.com:/crypto/bankb:ro
      - ./fablo-target/fabric-config/crypto-config/peerOrganizations/bankc.example.com:/crypto/bankc:ro
      - ./fablo-target/fabric-config/crypto-config/peerOrganizations/regulator.example.com:/crypto/regulator:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Must own Fablo's key files (mode 600). On WSL they belong to your user, uid 1000; check with
    #   stat -c %u fablo-target/fabric-config/crypto-config/peerOrganizations/banka.example.com/users/User1@banka.example.com/msp/keystore/*
    # Not root: with all capabilities dropped, root cannot read another user's 600 file anyway.
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

volumes:
  sentinel-db:
