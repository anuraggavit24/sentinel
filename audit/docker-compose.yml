services:
  db:
    image: postgres:16-alpine
    container_name: sentinel-audit-db
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: audit
    volumes:
      - audit-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 256m

  api:
    build: .
    container_name: sentinel-audit-api
    environment:
      DATABASE_URL: postgresql://audit:audit@db:5432/audit
      AUDIT_SIGNING_SEED: "1111111111111111111111111111111111111111111111111111111111111111"
      DEMO_INSIDER: "1"
    ports:
      - "8800:8800"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m

volumes:
  audit-db:
